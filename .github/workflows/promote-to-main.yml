name: Promouvoir develop vers main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: develop

  promote:
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier que le workflow est lancé depuis main
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Ce workflow doit être lancé depuis la branche main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fusionner develop dans main et pousser
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin develop main
          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/develop
          git push origin main
