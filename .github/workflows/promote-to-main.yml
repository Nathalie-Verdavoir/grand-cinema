name: Promouvoir develop vers main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: develop

  propose:
    needs: validate
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier que le workflow est lancé depuis main
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Ce workflow doit être lancé depuis la branche main."
            exit 1
          fi

      - name: Créer ou réutiliser la pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')"
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request existante : $existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "Promouvoir develop vers main" \
            --body "Pull request créée automatiquement après validation de develop. La fusion reste soumise aux protections de main."
