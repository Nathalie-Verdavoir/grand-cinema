name: Promouvoir une branche vers develop

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branche à proposer pour develop
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-to-develop
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ inputs.source_branch }}

  propose:
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier la branche source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE_BRANCH" || "$SOURCE_BRANCH" == "develop" || "$SOURCE_BRANCH" == "main" ]]; then
            echo "::error::La branche source doit être différente de develop et main."
            exit 1
          fi

          if [[ ! "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Nom de branche source invalide."
            exit 1
          fi

      - name: Créer ou réutiliser la pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --base develop --head "$SOURCE_BRANCH" --state open --json url --jq '.[0].url')"
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request existante : $existing_pr"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head "$SOURCE_BRANCH" \
            --title "Promouvoir $SOURCE_BRANCH vers develop" \
            --body "Pull request créée automatiquement par le workflow de promotion. Les tests ont été validés avant sa création."
