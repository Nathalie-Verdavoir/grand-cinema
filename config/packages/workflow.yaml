framework:
    workflows:
        seance_publishing:
            type: state_machine
            marking_store:
                type: method
                property: workflowStatus
            supports:
                - App\Entity\Seance
            initial_marking: draft
            places: [draft, published, cancelled]
            transitions:
                publish:
                    from: draft
                    to: published
                cancel:
                    from: [draft, published]
                    to: cancelled
                reopen:
                    from: cancelled
                    to: draft
